# Echo Spot 1st gen 2017 (rook), Fire OS 5.5.6.9 (LVY48F, build 690918120).  Shell syntax, no commands: sourced by the PC
# scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
# crown's SoC (MT8163) on Android 5.1.1 (API 22), kernel 3.18.19, Broadcom Wi-Fi (bcmdhd) and Bluetooth (UART), full
# Android: Alexa is a set of apps, Wi-Fi is Android's WifiService, iptables belongs to netd.  Values copied from
# crown were checked against the pulled firmware and a rooted Spot over adb (2026-11-04) unless marked "verify".

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Spot 1st gen (2017)"
MODEL_NUMBER=VN94DQ                       # the label on the Echo Spot (shown by setup.sh beside the model)
PRODUCT=rook                             # ro.product.device: no _puffin suffix on this one
FIRMWARE_ID=LVY48F                       # ro.build.display.id: Fire OS 5 names the Android build, not the Fire OS one;
                                         # FIRMWARE_BUILD tells the Fire OS builds apart
FIRMWARE_FILE=update-kindle-rook-304.6.9.0_user_690918120.bin   # from FTVDB's record of the build (its MD5 7b1c7d35…)
FIRMWARE_SHA256=616db16df6b1b8a94fa756e8aa970dd4f062c61d1d0d816c34807417f85cb5aa
DEFAULT_ARGS=""                          # hassmic arguments at install (ARGS)
# stock files that must be byte-identical to firmware/$DEVICE/rootfs/system (scripts/probe.sh): the wake word engine and
# where the front end lives (audio HAL, audioflinger, the binder client), and stock's wake word service.  The audio HAL
# is in lib/hw here (no /system/vendor/lib/hw on Fire OS 5)
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so lib/hw/audio.primary.mt8163.so lib/libwakewordserver_jni.so"

FIRMWARE_BUILD=690918120                 # ro.build.version.incremental is 304.6.9.0_user_690918120: this is its build number
# --- installation (scripts/install-boot.sh): not A/B (one system partition, dm-verity "verify" in the stock fstab.mt8163;
# the XDA root image had taken it out already), the policy in the boot ramdisk (/sepolicy, enforcing, version 26).
# The boot image is this build's own with root adb, without verify, the policy patched for adb and our services
# (scripts/mkbootroot.py, sepolicy.rules) and hassmic.rc inside (BOOT_RC below), flashed in amonet's hacked fastboot;
# then the files go onto /system from the running OS, as on crown.  Only boot and system are ever written; never lk,
# preloader, tee1/tee2.
INSTALL=boot
# the boot image's extras (scripts/mkbootroot.py through install-boot.sh): ro.build.tags=test-keys in default.prop, so that
# stock's /system/etc/init.fosflags.sh (adb_cd.sh: a release-keys build is a closed device) leaves adb on; hassmic.rc in
# the ramdisk, imported by init.rc, since Android 5.1's init reads no /system/etc/init/ (sysinstall.sh writes none there)
BOOT_PROPS="ro.build.tags=test-keys"
BOOT_RC=1
# Android's framework runs (WifiService has the Wi-Fi: wifictl.dex, its setWifiEnabled(boolean) of Android 5.1)
ANDROID=1
# Fire OS 5's toolbox lacks tr, sed, head, tail, cut, wc, sort, od, stat, pidof, pkill, timeout, find, xargs, printf,
# env, md5sum: build/rook/toybox (tools/mktoybox.sh) ships next to hassmic, and boot.sh / run.sh put its applets first
# on PATH (links under /data/local/hassmic/bin)
TOYBOX=1
BOOT_SHA256=a80a5e9dc750863fdda0edad423a43e18156c8be831eb933e0ddac865fc41f8a   # boot.img in FIRMWARE_FILE
BOOT_DEV=/dev/block/platform/mtk-msdc.0/by-name/boot
SYSTEM_DEV=/dev/block/platform/mtk-msdc.0/by-name/system
# the system partition as this build leaves it: tools/sdat2img.py of FIRMWARE_FILE's system.new.dat (reproducible),
# 1744723968 bytes
SYSTEM_IMG_SHA256=f14d04930d52db5127e272e4a268293721433f0c1faaff981c29c87a4ce8da67
# The policy tool: not donut's magiskpolicy32 (the Spot's Android 5.1 linker refuses it: no DT_HASH; and the Spot's
# TWRP is 64-bit, so nothing on the Spot runs a 32-bit tool either) but Magisk's arm64 magiskpolicy
# (lib/arm64-v8a/libmagiskpolicy.so of Magisk v31.1's app-debug.apk, sha256 of the apk b983c975…0778), run on the PC under
# qemu-aarch64 against TWRP's own bionic (SEPOLICY_RUNTIME: tools/twrp_bionic.py out of amonet-rook's bin/twrp.img;
# LD_LIBRARY_PATH=/sbin, where TWRP keeps everything).  Patched rook's policy on 2026-11-04 (print-rules checked)
SEPOLICY_TOOL=firmware/rook/magiskpolicy64
SEPOLICY_TOOL_SHA256=51fc92275f0c464c124a2d8e607e8b601e6ea4c44437f1e871cf175773fd75ce
SEPOLICY_RUNTIME=firmware/rook/twrp-bionic
# adbd for the ramdisk: sbin/adbd of the boot image in rook's own XDA boot-root.zip (R0rt1z2's amonet-rook thread,
# post 2), byte-identical to crown's and checkers' (CyanogenMod's, static, goes by ro.secure); root in su on the Spot
ADBD=firmware/rook/adbd
ADBD_SHA256=108ba4032081ede6e2a5fbad3eeafa6d90948b93fe799f3e76555327f0f041ad

# --- the daemon's user: no AIPC for audio here (verify: /dev/aipc exists on rook, init.rook.rc makes it for the
# apps, but the audio path is AudioFlinger's).  system records as on crown (AudioFlinger lets the system uid record with
# package "android").  Not root: hassmic faces the network.  input for the keys.  verify on the device
DAEMON_USER=system
# drmrpc: /dev/trustzone (root:drmrpc), the TEE behind the device attestation module that "Download from Amazon"
# signs with (dha.c hw_load: Android's loader, amzn_dha)
# radio: /dev/ttyMT1 (owner bluetooth, group radio, 0660), the Broadcom controller's UART (bt_uart.c)
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack,drmrpc,radio

# --- stock: Alexa is Android apps, started by the framework, not init: alexa-off.sh disables these with pm (and
# alexa-on.sh enables them again).  crown's list, less what rook has not (ambienthome, d3, datastore, htmlruntime,
# amasetup: pm list packages on the Spot, 2026-11-04); verify which fail without Alexa and which crash in a loop
ALEXA_PROP=
ALEXA_SERVICES=
ALEXA_PACKAGES="com.amazon.bishop com.amazon.device.echoaudioservice com.amazon.afe.app com.amazon.alexa.awaservice com.amazon.NativeAccessorProxyServices com.amazon.paladin com.amazon.whad com.amazon.cardinal com.amazon.a4b.conferencing.chime com.amazon.a4b.mcc"
# Stock apps taken off the system partition altogether (sysinstall.sh, into /system/hassmic-removed, where sounds.c
# still finds the sounds board.c names in them): crown's list, cut to the folders rook has (86 of them), plus Amazon's
# System UI (crashes in a loop without amazon.speech.sim: "SimClient was never got created", a "System UI has stopped"
# dialog over hassmic's home screen) and com.amazon.tcomm (the same after a wake word), 2026-11-04.  As on crown, the
# APKs that are shared libraries declared in /system/etc/permissions stay (amazon.jackson-19, com.amazon.communication,
# DeviceMessagingAndroid[Internal]SDK, DeviceSoftwareOTAContracts, MetricsApi, MinervaApi, com.amazon.device.sync.sdk.internal),
# and Android's own.  SpeechInteractionManager (amazon.speech.sim) stays on the partition and enabled: its native
# wake word service holds an AudioRecord on the HAL's front end, and without it the mic stream hassmic gets is silence
# (-96 dBFS, peak 1, 2026-11-04: the boot after it was taken off); it ran in every boot the mic worked, disabled or not
# (a persistent app), and it needs amazon.speech.davs.davcservice ("GenericDavsService UnAvailable" without it), which
# stays too.  Their egress is locked like everything else's.  Verify which of the rest rook still needs
STOCK_APPS_OUT="
app/AmazonDeviceMetrics app/Bluetooth app/KnightBluetoothAVRCPClient app/SidewalkDeviceService app/fdrw app/whad_app
priv-app/AmazonKKWebViewLib priv-app/AmazonUsageStatsListener priv-app/Banyan-FireOS-Instance-amazon-release
priv-app/ContentSupportProvider priv-app/CrashManager priv-app/DeviceClientPlatformContractsFramework
priv-app/DeviceMessagingAndroid priv-app/DeviceSoftwareOTA priv-app/DeviceSoftwareOTAIdleOverride priv-app/EchoAudioService
priv-app/EnvironmentContextService priv-app/FireApplicationCompatibilityEnforcer priv-app/FireApplicationCompatibilityEnforcerSDK
priv-app/FireRecessProxy priv-app/GadgetsControlManager priv-app/HumanDetectionService priv-app/IvonaTTS
priv-app/IvonaTtsOrchestrator priv-app/KnightSettings priv-app/LogManager-logd priv-app/MetricsService
priv-app/MultimodalWifiPasswordSyncApp priv-app/NativeAccessorProxyServices priv-app/RemoteSettingsAndroid
priv-app/RemoteSettingsInternalSDK priv-app/SmartHomeBleAdapterService priv-app/SmartHomeEchoAdapterService
priv-app/SmartHomeEndpointDetectorCA priv-app/SmartHomeMultiModalUxService priv-app/SmartHomeOtaService
priv-app/SmartHomeService priv-app/SmartHomeWifiAdapterService priv-app/SystemUI
priv-app/UDPControllerService priv-app/bluestone-kb priv-app/com.amazon.adep
priv-app/com.amazon.afe.app priv-app/com.amazon.alarms priv-app/com.amazon.alexa.awaservice
priv-app/com.amazon.alexa.beaconbroadcaster priv-app/com.amazon.alexa.timeoutmanagerapp
priv-app/com.amazon.alexa.webmediaplayer.fireos priv-app/com.amazon.alexa.youtube.app
priv-app/com.amazon.apl.awsanalyticsextension priv-app/com.amazon.aria priv-app/com.amazon.assetsync.service
priv-app/com.amazon.avod priv-app/com.amazon.bishop priv-app/com.amazon.cardinal priv-app/com.amazon.comms.knightmessaging
priv-app/com.amazon.comms.multimodaltachyonarm priv-app/com.amazon.communication.discovery priv-app/com.amazon.csapp
priv-app/com.amazon.device.sync priv-app/com.amazon.diode priv-app/com.amazon.dp.logger priv-app/com.amazon.gloria.smarthome
priv-app/com.amazon.h2clientservice priv-app/com.amazon.identity.auth.device.authorization priv-app/com.amazon.imp
priv-app/com.amazon.kindle.otter.oobe priv-app/com.amazon.kindleautomatictimezone priv-app/com.amazon.knight.blink
priv-app/com.amazon.knightwebview priv-app/com.amazon.mlv priv-app/com.amazon.obscura priv-app/com.amazon.paladin
priv-app/com.amazon.rtcsessioncontroller priv-app/com.amazon.securitysyncclient priv-app/com.amazon.selector.clock.resources
priv-app/com.amazon.spotify.mediabrowserservice-stub priv-app/com.amazon.spotlight priv-app/com.amazon.tcomm
priv-app/com.amazon.tcomm.jackson priv-app/com.amazon.virtual.dash.knight.app priv-app/com.amazon.wha.mediabrowserservice-stub
priv-app/com.amazon.zordon priv-app/marketplace_service_receiver priv-app/shipmode
priv-app/com.amazon.clockfaceselector priv-app/com.amazon.platformsettings
"
# hassmic's home screen (tools/mkhome.py: no code, android.app.Activity, black): sysinstall.sh puts it in /system/app
HOME_APK=hassmic-home.apk
# Android's settings for a satellite (alexa-off.sh, "namespace/key=value"; old values back with alexa-on.sh): the
# screen off after 5 min, 1 min with the mic off or in Do not disturb (ring_band.c); Android's Bluetooth off
# (hassmic cannot drive the Spot's UART controller yet: board.c); no rotation on a round screen; the backlight by
# Android's own auto brightness from the light sensor (the OPT3001, board.c), as stock's: 120 of 255 fixed glowed at
# half in a dark room, auto took it to 8 at 0.22 lux (2026-11-06)
ANDROID_SETTINGS="system/screen_off_timeout=300000 global/bluetooth_on=0 system/screen_brightness_mode=1 system/accelerometer_rotation=0"
# the light band at the bottom of the screen (ring_band.c, ringbar.dex) reserves its rows with the window manager's
# overscan, which Android keeps in /data/system/display_settings.xml: alexa-on.sh gives them back
SCREEN_BAND=1
# a kernel wake lock root's main.sh holds while the satellite runs (verify: whether the 3.18 kernel autosleeps)
WAKE_LOCK=hassmic
# main.sh restarts the media server at satellite start: the one from boot never carries hassmic's playback to the
# primary output (dumpsys media.audio_flinger: 0 tracks, 0 writes while hassmic "speaks"), a fresh one does, the mic
# with it; found 2026-11-05 after a day of chasing the kernel, codec and amplifier, which were all fine
MEDIA_RESTART=1
# The Wi-Fi driver of our own build (device.mk WIFIDRV) and where Fire OS's Wi-Fi HAL loads it from: sysinstall.sh puts it
# there, stock's kept as .pre-hassmic for --uninstall.  Amazon's refuses Wi-Fi power save, and the chip's Wi-Fi then
# kept the antenna its Bluetooth shares (a phone's music skipped, 2026-11-05)
WIFI_DRIVER=bcmdhd.ko:/system/lib/modules/bcmdhd.ko
# firmware updates: an app with a sharedUserId of its own (not used yet: the firewall must cut its uid off)
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=
# init services of Amazon's that talk to the cloud (init.rook.rc): stopped by main.sh
CLOUD_SERVICES="trackerd whad_cc quantum shblemeshd smarthomewifid meshmgrservice perfmonitord halo-hub-core halo-hub-broker halo-core-swp halo-msg-bridge halo-regiond halo-logr halo-bssid-scan"
BT_SERVICE=
UX_SERVICE=
SETUP_SERVICES=
SETUP_PACKAGES="com.amazon.kindle.otter.oobe"
# Wi-Fi belongs to Android's WifiService in system_server; wpa_supplicant's control sockets (verify: init.rook.rc)
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: none (device.mk: Broadcom's driver, no module of ours)
KMOD=
KMOD_ARGS=""

# --- firewall: stock's firewall.sh (def_firewall in init.rook.rc) and netd's chains.  What lockdown.sh's keep needs
# beyond its own list, worded as "iptables -S" prints it, ";" between rules: DHCP answers (to the broadcast address,
# so conntrack does not take them for replies).  verify on the device
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
