# Echo Plus 1st gen (2017) (sonar), Fire OS 5.5.6.9 (LVY48F, build 690918120).  Shell syntax, no commands: sourced by
# the PC scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
#
# DRAFT, from the firmware alone (firmware/sonar/{boot.img,images/*,system/build.prop,ota.prop}) — nothing here has
# been checked against a running Echo Plus yet (no unit unlocked, no rootfs unpacked).  Every "TODO" line needs either
# the unpacked system partition (tools/payload_dump.py or sdat2img.py once we have system.new.dat, as rook's
# device.conf comment describes) or a rooted Plus on adb.  Modelled on devices/rook/device.conf: same SoC generation.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Plus 1st gen (2017)"
MODEL_NUMBER=ZE39KL                       # the label on the box/base (devices/MODELS.md)
PRODUCT=sonar                            # ro.product.device (firmware/sonar/system/build.prop)
FIRMWARE_ID=LVY48F                       # ro.build.display.id: same Android build id as rook; FIRMWARE_BUILD tells
                                         # the Fire OS builds apart (rook is 304.*, sonar is 256.*)
FIRMWARE_FILE=update-kindle-csm_sonar-256.6.9.0_user_690918120.bin
FIRMWARE_SHA256=TODO                     # sha256 of FIRMWARE_FILE once pinned from FTVDB's record page (devices/README.md
                                         # step 1); the copy in firmware/sonar/ was hand-fetched, verify it against FTVDB
                                         # before relying on this being THE build to pin
# TODO: PROBE_FILES needs the unpacked rootfs (we only have system/build.prop so far, not system.img/system.new.dat).
# Expect the same shape as rook's (wake word engine + front end + audio HAL + binder client), but confirm the HAL name:
# rook links libasp inside audio.primary.mt8163.so; sonar may differ if its audio path is not AudioFlinger/OpenSL (verify).
PROBE_FILES="TODO"

FIRMWARE_BUILD=690918120                 # ro.build.version.incremental is 256.6.9.0_user_690918120 (rook: 304.6.9.0_*)
# --- installation: TODO, pending an actual unlock attempt (devices/README.md step 1 says this is the hard part and
# different per model).  What the firmware tells us so far (firmware/sonar/images/lk.bin):
#   - same MT8163 lk/preloader generation as rook/crown (platform/mt8163, MTK_BLOADER_INFO_v16): the BootROM exploit
#     class that unlocked rook should apply in principle, but needs confirming on this specific unit/BootROM revision.
#   - fastboot unlock is Amazon-signed the same way as rook's (amzn_verify_limited_unlock / unlock_code tied to
#     mac_sec/serial): "fastboot oem unlock" is not the path here either.
#   - unlike rook, ro.boot.selinux=disable is already in sonar's stock cmdline/build.prop: if that holds on a real
#     unit, sepolicy.rules may need little or nothing (verify: enforcing can still be forced back on by init; check
#     getenforce on a booted unit before assuming this).
#   - the stock fstab line has "verify" on /system (dm-verity), same as rook: INSTALL=boot (patched boot ramdisk,
#     verify stripped, root adb) is the expected method once there is an unlock; not A/B (one system partition).
INSTALL=boot
BOOT_PROPS="ro.build.tags=test-keys"      # same reasoning as rook: release-keys stock strips adb (verify sonar's own
                                          # init.fosflags.sh/adb_cd.sh do the same before assuming this is needed)
BOOT_RC=1                                 # Android 5.1 init reads no /system/etc/init/: hassmic.rc goes in the ramdisk
ANDROID=1                                  # full Android framework, same as rook (Alexa = apps, WifiService)
# TODO: Fire OS 5's toolbox is missing the same applets on every MT8163 Fire OS 5 build so far (rook); assume so until
# checked on sonar, since tools/mktoybox.sh's static toybox is cheap insurance either way.
TOYBOX=1
BOOT_SHA256=6f7842e21ab55d973e58ccf60fcbb709070d0e4eb4cd9a674e797f28ce522ad5   # boot.img as pulled 2026-11-09 (firmware/sonar/boot.img);
                                                                               # NOT yet cross-checked against FTVDB's own copy of FIRMWARE_FILE
BOOT_DEV=TODO                            # /dev/block/platform/mtk-msdc.0/by-name/boot on rook/crown; MT8163 again, so
                                          # likely the same by-name path, but confirm on a unit before writing to it
SYSTEM_DEV=TODO                          # likewise, likely .../by-name/system
SYSTEM_IMG_SHA256=TODO                   # needs system.new.dat extracted from FIRMWARE_FILE (tools/sdat2img.py, as
                                          # device.conf's comment on rook describes) — not done yet
# TODO: same tool chain question as rook (SEPOLICY_TOOL/SEPOLICY_RUNTIME): if selinux really is disabled on sonar,
# this whole patching step may be skippable; if it must be forced back to permissive/enforcing-with-rules the way
# rook's was, reuse rook's magiskpolicy64 + twrp-bionic approach (same arm64 TWRP constraint: Fire OS 5's 5.1 linker
# has no DT_HASH, so donut's 32-bit magiskpolicy will not run on this device's TWRP either, if TWRP exists for sonar).
SEPOLICY_TOOL=TODO
SEPOLICY_TOOL_SHA256=TODO
SEPOLICY_RUNTIME=TODO
# TODO: adbd for the ramdisk. rook's came from its own XDA boot-root zip and needed the property-area patch
# (device.conf ADBD_PATCH) because that adbd's bionic is newer than 5.1's. If sonar has no public unlock/root project
# yet, this needs its own adbd (or reuse rook's firmware/rook/adbd if byte-compatible — verify, do not assume) and
# its own patch offset if the same symptom shows up (adb over Wi-Fi silently not listening after switching to su).
ADBD=TODO
ADBD_SHA256=TODO
ADBD_PATCH=TODO

