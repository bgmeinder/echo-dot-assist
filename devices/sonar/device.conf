# Echo Plus 1st gen (2017) (sonar), Fire OS 5.5.6.9 (LVY48F, build 690918120).  Shell syntax, no commands: sourced by
# the PC scripts (scripts/lib/device.sh) and, shipped next to them, by the scripts on the Echo.
#
# DRAFT — updated 2026-11-09 against the fully unpacked firmware (firmware/sonar/rootfs, rootfs_ramdisk: system.img
# rdumped, boot ramdisk cpio'd), which backs most values below with a sourced comment. Nothing here has been checked
# against a RUNNING Echo Plus yet (no unit unlocked): every remaining "TODO" needs that — a rooted Plus on adb.
# Modelled on devices/rook/device.conf: same SoC generation.

# --- identity: what the connected Echo must report before anything is written to it
MODEL_NAME="Echo Plus 1st gen (2017)"
MODEL_NUMBER=ZE39KL                       # the label on the box/base (devices/MODELS.md)
PRODUCT=sonar                            # ro.product.device (firmware/sonar/system/build.prop)
FIRMWARE_ID=LVY48F                       # ro.build.display.id: same Android build id as rook; FIRMWARE_BUILD tells
                                         # the Fire OS builds apart (rook is 304.*, sonar is 256.*)
FIRMWARE_FILE=update-kindle-csm_sonar-256.6.9.0_user_690918120.bin
FIRMWARE_SHA256=a3b828bd3cafb4853bc52f8c42b9b2b5a82eeec9726b3ccfac097ab84742e93f  # the copy in firmware/sonar/, hand-fetched
                                         # 2026-11-09 — NOT yet cross-checked against FTVDB's own record page for this
                                         # build (devices/README.md step 1); do that before trusting this is pinned
# Confirmed 2026-11-09 against the unpacked rootfs (firmware/sonar/rootfs/system): every one of rook's PROBE_FILES
# exists here under the identical path, including the same audio HAL name (audio.primary.mt8163.so: libasp runs
# inside it, same as rook, no Amazon mixer/libmixerAPI anywhere in the rootfs) and the same wake word JNI library.
PROBE_FILES="lib/libpryon.so lib/libasp.so lib/libaspclient.so lib/libaudioflinger.so lib/hw/audio.primary.mt8163.so lib/libwakewordserver_jni.so"

FIRMWARE_BUILD=690918120                 # ro.build.version.incremental is 256.6.9.0_user_690918120 (rook: 304.6.9.0_*)
# --- installation: TODO, pending an actual unlock attempt (devices/README.md step 1 says this is the hard part and
# different per model).  What the firmware tells us so far (firmware/sonar/images/lk.bin):
#   - same MT8163 lk/preloader generation as rook/crown (platform/mt8163, MTK_BLOADER_INFO_v16): the BootROM exploit
#     class that unlocked rook should apply in principle, but needs confirming on this specific unit/BootROM revision.
#   - fastboot unlock is Amazon-signed the same way as rook's (amzn_verify_limited_unlock / unlock_code tied to
#     mac_sec/serial): "fastboot oem unlock" is not the path here either.
#   - `ro.boot.selinux=disable` is in build.prop, but DO NOT trust it (checked further 2026-11-09): ro.boot.* props
#     are supposed to come from the kernel cmdline at boot, not be baked into build.prop as a static line, and the
#     boot image's own static cmdline carries no androidboot.selinux at all. lk.bin itself has the string
#     "%s androidboot.selinux=permissive" (conditionally appended at boot, not "disable") — so the live state is
#     genuinely unknown; assume enforcing (rook's situation) until `getenforce`/`cat /proc/cmdline` on a real unit
#     says otherwise.
#   - the stock fstab line has "verify" on /system (dm-verity), same as rook: INSTALL=boot (patched boot ramdisk,
#     verify stripped, root adb) is the expected method once there is an unlock; not A/B (one system partition).
INSTALL=boot
# Confirmed 2026-11-09: system/etc/adb_cd.sh and system/etc/init.fosflags.sh are byte-for-byte the same logic as
# rook's — `getprop ro.build.tags`, "release-keys" => closed device => adb stripped from persist.sys.usb.config.
# default.prop also has `ro.secure=1`, `ro.debuggable=0` stock. test-keys fixes it, same as rook.
BOOT_PROPS="ro.build.tags=test-keys"
BOOT_RC=1                                 # Android 5.1 init reads no /system/etc/init/: hassmic.rc goes in the ramdisk
ANDROID=1                                  # full Android framework, same as rook (Alexa = apps, WifiService)
# Confirmed 2026-11-09: system/bin/toolbox is a single plain binary with no tr/sed/head/tail/pidof alongside it
# (unlike a full busybox-style toolbox with applet symlinks) — same shape as rook's. tools/mktoybox.sh's static
# toybox ships alongside.
TOYBOX=1
BOOT_SHA256=6f7842e21ab55d973e58ccf60fcbb709070d0e4eb4cd9a674e797f28ce522ad5   # boot.img as pulled 2026-11-09 (firmware/sonar/boot.img);
                                                                               # NOT yet cross-checked against FTVDB's own copy of FIRMWARE_FILE
# Confirmed 2026-11-09 from the ramdisk's own fstab.mt8163 (the file `mount_all` actually loads at boot) and
# init.mt8163.rc's bootimg symlink: identical paths to rook's. (The boot ramdisk also carries a generic A/B
# soc/by-name/{boot,system}_{a,b} symlink block gated on `ro.boot.slot_suffix`, same AOSP boilerplate seen in
# rook's ramdisk; fstab.mt8163 itself has no suffixed partitions, so that block is inert here, same as on rook —
# this is not an A/B device.)
BOOT_DEV=/dev/block/platform/mtk-msdc.0/by-name/boot
SYSTEM_DEV=/dev/block/platform/mtk-msdc.0/by-name/system
SYSTEM_IMG_SHA256=63090a0333555e7bffd0919490857aa71e355cec672e72b6c86d61f4aa3c20a0  # built 2026-11-09 with
                                          # tools/sdat2img.py from FIRMWARE_FILE's system.new.dat, 1073676288 bytes
# TODO: assume this is needed (see the selinux note above: do not trust build.prop's "disable"). Policy version
# confirmed 2026-11-09 from the ramdisk's own compiled `sepolicy` file (firmware/sonar/rootfs_ramdisk/sepolicy):
# it does have real type definitions (thermal_manager, soc_gpio_device, etc. — not an empty/disabled policy file),
# consistent with v26-era Android 5.1 policy, same generation as rook's. Reuse rook's magiskpolicy64 + twrp-bionic
# approach (same arm64 TWRP constraint expected: Fire OS 5's 5.1 linker lacks DT_HASH, so donut's 32-bit magiskpolicy
# should not run on this device's TWRP either, if TWRP exists for sonar — unconfirmed, no TWRP port known yet).
SEPOLICY_TOOL=TODO
SEPOLICY_TOOL_SHA256=TODO
SEPOLICY_RUNTIME=TODO
# Potentially simpler than rook here: this build's OWN boot ramdisk already carries
# `service adbd /sbin/adbd --root_seclabel=u:r:su:s0` in init.rc (confirmed 2026-11-09) — the same root-adb path
# rook needed a borrowed XDA adbd for, except sonar's own stock sbin/adbd (pulled straight from this build's boot
# ramdisk, not from an unrelated unlock project) is already the right bionic for this system, unlike rook's XDA adbd
# (Android 7's bionic on a 5.1 system), which is what caused rook's ADBD_PATCH property-area bug in the first place.
# If that holds (needs confirming on a real unit: whether adb over Wi-Fi actually listens with ro.secure=0 and this
# adbd, and whether SELinux being disabled already removes any need for a su domain transition rule at all), sonar
# may need no ADBD_PATCH whatsoever — just `ro.secure=0` on a boot image built from its own stock boot.img.
ADBD=firmware/sonar/adbd                                  # this build's own sbin/adbd, pulled straight out of its boot
                                                          # ramdisk 2026-11-09 (firmware/sonar/rootfs_ramdisk/sbin/adbd)
ADBD_SHA256=4d0733f2525ce93a583ebf989c1bd702fc451c2f50174259c0222f9ed63a276d   # NOT yet proven to work rooted on a unit
ADBD_PATCH=                                               # empty: expected unnecessary (see comment above), unconfirmed

# --- the daemon's user: TODO final confirmation needs `ps -Z`/`ls -lZ` on a rooted unit, but the rootfs itself backs
# up the same guess as rook's: init.sonar.rc does "mkdir /dev/aipc 2770 system aipc" (same as rook's init.rook.rc),
# no libmixerAPI.so anywhere on the partition (audio really is AudioFlinger's, not AIPC's), and bt_vendor.conf has the
# same UartPort /dev/ttyMT1 as rook (radio group, same reasoning as rook's DAEMON_GROUPS comment)
DAEMON_USER=system
DAEMON_GROUPS=system,audio,inet,input,net_bt_stack,drmrpc,radio   # rook's list, unconfirmed on a live sonar unit yet

# --- stock: Alexa is Android apps (same model as rook). Package names below are read out of each APK's own compiled
# AndroidManifest.xml (the string pool, UTF-16LE: the "com.amazon...." strings each manifest carries), not guessed
# from the folder name, except where marked "folder name, unconfirmed" — those are Amazon's own convention (the
# folder is the package id) elsewhere in this same rootfs, but not individually opened. Nothing here is checked
# against `pm list packages`/crash behaviour on a running unit yet (devices/README.md: "verify which fail without
# Alexa and which crash in a loop" applies here just as much as it did to rook/crown).
ALEXA_PROP=TODO                           # TODO: needs a live `getprop` (rook's is empty too; may stay empty)
ALEXA_SERVICES=TODO                       # TODO: needs init.sonar.rc service names cross-checked against what's
                                          # actually started vs. just defined (several are already `disabled` there)
# This firmware (csm_sonar, pre-"Knight" naming) does not have rook's com.amazon.bishop/cardinal/paladin/whad/afe.app/
# a4b.*/wifilocker packages at all — a different app set, not a subset. Kept off this list, same as rook: Speech
# InteractionManager (native wake word service holds the AudioRecord front end) and amazon.speech.davs.davcservice
# (SpeechInteractionManager needs it running, "GenericDavsService UnAvailable" otherwise, per rook's own note).
ALEXA_PACKAGES="com.amazon.alexahybridservice com.amazon.tcomm com.amazon.tcomm.jackson com.amazon.comms.headlesstachyon
com.amazon.mediaplayeragent com.amazon.diode com.amazon.imp com.amazon.whisperjoin.middleware com.amazon.headlessbeacon
com.amazon.alexa.beaconbroadcaster com.amazon.adep com.amazon.platformsettings com.amazon.securitysyncclient
com.amazon.spotify.mediabrowserservice-stub com.amazon.wha.mediabrowserservice-stub com.amazon.dp.logger
com.amazon.device.networkderegistrationcontroller
SmartHomeHeadlessUxService SmartHomeEchoAdapterService SmartHomeEndpointDetectorCA SmartHomeOtaService SmartHomeService
SmartHomeWifiAdapterService SmartHomeZigbeeAdapterService HeadlessBtUxController CSMBluetoothV2"
                                          # the un-dotted names above (SmartHome*, HeadlessBtUxController, CSMBluetoothV2)
                                          # are folder names, not confirmed package ids (pm disable takes the package
                                          # id, which for a couple of these resolved to something longer when checked,
                                          # e.g. SmartHomeHeadlessUxService -> com.amazon.device.smarthome.dshs.headlessux:
                                          # re-derive each from its own APK's manifest before trusting this list verbatim)
# Everything below also only has priv-app/app folders that are verbatim in rook's own STOCK_APPS_OUT (cross-checked
# against firmware/sonar/rootfs/system/{priv-app,app} 2026-11-09): kept to the intersection, not copied wholesale —
# sonar's rootfs simply does not have the rest of rook's list (SystemUI, KnightSettings, com.amazon.bishop, etc.)
STOCK_APPS_OUT="
app/Bluetooth app/SidewalkDeviceService app/fdrw app/whad_app
priv-app/AmazonUsageStatsListener priv-app/CrashManager priv-app/DeviceClientPlatformContractsFramework
priv-app/DeviceMessagingAndroid priv-app/DeviceSoftwareOTA priv-app/DeviceSoftwareOTAContracts
priv-app/FireApplicationCompatibilityEnforcer priv-app/FireApplicationCompatibilityEnforcerSDK priv-app/FireRecessProxy
priv-app/GadgetsControlManager priv-app/LogManager-logd priv-app/MetricsApi priv-app/MetricsService priv-app/MinervaApi
priv-app/NativeAccessorProxyServices priv-app/RemoteSettingsAndroid priv-app/RemoteSettingsInternalSDK
priv-app/SmartHomeEchoAdapterService priv-app/SmartHomeEndpointDetectorCA priv-app/SmartHomeOtaService
priv-app/SmartHomeService priv-app/SmartHomeWifiAdapterService priv-app/SsdpService priv-app/UDPControllerService
priv-app/com.amazon.adep priv-app/com.amazon.diode priv-app/com.amazon.dp.logger priv-app/com.amazon.securitysyncclient
priv-app/com.amazon.spotify.mediabrowserservice-stub priv-app/com.amazon.tcomm priv-app/com.amazon.tcomm.jackson
priv-app/com.amazon.wha.mediabrowserservice-stub
"
# shared libraries declared in /system/etc/permissions stay on the partition, same reasoning as rook:
# amazon.jackson-19, DeviceMessagingAndroid[Internal]SDK, MetricsApi (TODO: check sonar's own /system/etc/permissions
# before removing it from STOCK_APPS_OUT above — listed there on rook, not yet individually confirmed here)
HOME_APK=                                 # sonar is headless (ro.build.configuration=headless): no screen, so no
                                          # home-screen activity to install (unlike rook/crown/checkers)
ANDROID_SETTINGS=TODO                     # TODO: no screen to blank/rotate, but confirm there is nothing Plus-specific
                                          # to set here (Bluetooth default, etc.); rook's own line is screen-specific
                                          # and does not apply (system/accelerometer_rotation, screen_brightness_mode)
SCREEN_BAND=                              # no screen: ring.c (LED ring: confirmed, system/etc/led-resources and
                                          # ledcontroller/ledctrl are both present), not ring_band.c — see device.mk RING

# --- misc:
WAKE_LOCK=hassmic
MEDIA_RESTART=TODO                        # rook needed this (boot-time mediaserver never carried hassmic's playback
                                          # to the primary output); unconfirmed whether sonar's init has the same gap
                                          # (only answerable by actually hearing the speaker on a rooted unit)
# Confirmed 2026-11-09 from the unpacked rootfs: Broadcom, same chip family as rook. system/etc/bluetooth/bt_vendor.conf
# has the identical UartPort (/dev/ttyMT1); system/lib/modules/bcmdhd.ko is the kernel module name (same as rook);
# system/vendor/firmware/brcm/ has bcm43569a2-firmware.bin + bcm43569a2.nvm and a BT patch
# BCM43569A2_001.003.004.0167.0216.hcd (rook's is …0215.hcd: a different patch revision of the very same chip,
# BCM43569A2). The kernel/driver build inputs below are an unconfirmed starting guess (rook's own
# WIFIDRV_URL/_COMMIT/_ARGS and kernel toolchain): sonar's own kernel version is not yet confirmed (see device.mk).
WIFI_DRIVER=bcmdhd.ko:/system/lib/modules/bcmdhd.ko
UPDATE_SERVICES=
UPDATE_PACKAGES="com.amazon.device.software.ota"
UPDATE_ONDEMAND=
# Confirmed 2026-11-09 by grepping every `service <name>` line across the whole unpacked boot ramdisk (not just
# init.sonar.rc: several are defined in imported .rc files, e.g. legacy-sidewalk-services.rc): identical to rook's
# CLOUD_SERVICES, every single name present verbatim.
CLOUD_SERVICES="trackerd whad_cc quantum shblemeshd smarthomewifid meshmgrservice perfmonitord halo-hub-core halo-hub-broker halo-core-swp halo-msg-bridge halo-regiond halo-logr halo-bssid-scan"
BT_SERVICE=
UX_SERVICE=
SETUP_SERVICES=
# NOT rook's com.amazon.kindle.otter.oobe: that package does not exist in sonar's rootfs at all. This build's OOBE
# app is com.amazon.echo.csm.oobe (confirmed from its own APK's manifest, 2026-11-09)
SETUP_PACKAGES="com.amazon.echo.csm.oobe"
WIFI_SERVICE=
WLAN=wlan0
WPA_SOCKETS=/data/misc/wifi/sockets

# --- Wi-Fi motion: none wired up yet (Broadcom bcmdhd confirmed above, same as rook: neither kernel module of
# src/kmod/ targets this driver, so nothing to load)
KMOD=
KMOD_ARGS=""

# --- firewall: TODO, needs the stock firewall.sh / netd chains off a running unit (same shape as rook's FW_KEEP is a
# reasonable starting guess — same fstab/init family — but not confirmed: it depends on what DHCP/mDNS rules stock's
# firewall actually installs on this unit)
FW_KEEP="INPUT -i wlan0 -p udp -m udp --sport 67 --dport 68 -j ACCEPT"
